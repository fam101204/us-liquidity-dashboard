name: Refresh official liquidity data

on:
  schedule:
    - cron: '20 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update_data.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/observation_history.json data/score_history.json data/forward_analysis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official US liquidity data'
            git push
          fi
